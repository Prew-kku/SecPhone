services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?ต้องตั้ง POSTGRES_USER ใน .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD ใน .env}
      POSTGRES_DB: ${POSTGRES_DB:?ต้องตั้ง POSTGRES_DB ใน .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # ไม่ publish port ออก host โดยค่าเริ่มต้น (เพิ่มใน docker-compose.override.yml เมื่อต้อง debug)
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sp_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # สร้างจาก POSTGRES_* เพื่อไม่ให้มีสองแหล่งความจริงของ credentials
      # (ค่า DATABASE_URL ใน .env ใช้สำหรับ Path B/local Prisma CLI ซึ่ง host เป็น localhost)
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public}
      JWT_SECRET: ${JWT_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_DEMO_ADMIN: ${SEED_DEMO_ADMIN:-false}
      SEED_OVERWRITE: ${SEED_OVERWRITE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      # อ่านที่ runtime ฝั่ง server (ไม่ถูก inline ตอน build เหมือน NEXT_PUBLIC_*)
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-SecondPhone Store}
      DEMO_MODE: ${DEMO_MODE:-true}
      LINE_ID: ${LINE_ID:-}
      FACEBOOK_URL: ${FACEBOOK_URL:-}
      PHONE_NUMBER: ${PHONE_NUMBER:-}
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/app/uploads
    networks:
      - sp_net

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local

networks:
  sp_net:
    driver: bridge
